[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "a-share-factor-miner"
version = "1.0.0"
description = "Auditable A-share mathematical and residual-information factor miner"
requires-python = ">=3.11"
dependencies = [
  "numpy>=1.26,<3",
  "pandas>=2.1,<4",
  "pyarrow>=15,<25",
  "scipy>=1.11,<2",
  "psutil>=5.9,<8",
  "matplotlib>=3.8,<4",
]

[project.optional-dependencies]
test = ["pytest>=8,<10"]
quality = ["ruff>=0.12,<1", "mypy>=1.17,<2"]

[project.scripts]
a-share-factor-miner = "factorforge.cli:main"

[tool.setuptools.packages.find]
where = ["源码"]

[tool.setuptools.package-data]
"factorforge.resources" = ["*.json"]

[tool.pytest.ini_options]
pythonpath = ["源码"]
testpaths = ["测试"]
addopts = "-q"

[tool.ruff]
target-version = "py311"
line-length = 88
extend-exclude = ["outputs", "customer_package"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.11"
packages = ["factorforge"]
warn_unused_configs = true
warn_redundant_casts = true
check_untyped_defs = true
